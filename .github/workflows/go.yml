# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Build
      run: go build -v ./...

  llgo-test:
    name: llgo-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.0'

    - name: Check out LLGo
      uses: actions/checkout@v4
      with:
        repository: xgo-dev/llgo
        # Includes the merged stdcall support required by the direct Winsock
        # declarations while keeping this library test independent of R9.
        ref: 6fc2ef150f95d8b9331433f325fcb1b6ee5ad4e4
        path: .llgo

    - name: Set up LLGo dependencies
      uses: ./.llgo/.github/actions/setup-deps
      with:
        llvm-version: '22'

    - name: Build LLGo
      working-directory: .llgo
      env:
        GOFLAGS: -tags=byollvm
      run: |
        # Stable LLGo predates the default-version switch, but its source can
        # build against system LLVM 22 through the released binding package.
        go mod edit -require=github.com/xgo-dev/llvm@v0.9.8
        go mod download github.com/xgo-dev/llvm@v0.9.8
        go build -tags=dev -o "$RUNNER_TEMP/llgo" ./cmd/llgo

    - name: Test LLGo native bindings
      env:
        LLGO_BUILD_CACHE: 'off'
        LLGO_ROOT: ${{ github.workspace }}/.llgo
      run: |
        "$RUNNER_TEMP/llgo" test -count=1 -v ./c ./c/math/rand ./c/net ./c/os ./c/setjmp ./c/time ./cpp/std

    # The Unix binding exposes libc++'s C++ ABI and is therefore exercised on
    # macOS. Linux LLVM packages use libstdc++; Windows is tested below through
    # its stable C bridge.
    - name: Test LLGo LLVM demangle bindings
      if: runner.os == 'macOS'
      env:
        LLGO_BUILD_CACHE: 'off'
        LLGO_ROOT: ${{ github.workspace }}/.llgo
      run: |
        "$RUNNER_TEMP/llgo" test -v ./cpp/llvm

  windows-llvm-demangle:
    name: Windows LLVM 22 demangle bridge
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - name: Cache LLVM 22 development archive
      id: llvm-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.tool_cache }}\lib-llvm\clang+llvm-22.1.8-x86_64-pc-windows-msvc.tar.xz
        key: lib-llvm-22.1.8-windows-msvc-d96c2cc1736f4eb7fa43cb9bbdf56d93551a9ae0a9aadb9c99c3c3b2b712a234-v1

    - name: Install LLVM 22 development archive
      shell: pwsh
      env:
        LLVM_VERSION: '22.1.8'
        LLVM_SHA256: d96c2cc1736f4eb7fa43cb9bbdf56d93551a9ae0a9aadb9c99c3c3b2b712a234
      run: |
        $ErrorActionPreference = "Stop"
        $archiveName = "clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
        $archiveDir = Join-Path $env:RUNNER_TOOL_CACHE "lib-llvm"
        $archive = Join-Path $archiveDir $archiveName
        if ("${{ steps.llvm-cache.outputs.cache-hit }}" -ne "true") {
          New-Item -ItemType Directory -Force $archiveDir | Out-Null
          $asset = $archiveName.Replace("+", "%2B")
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/$asset"
          & curl.exe --fail --location --retry 5 --retry-all-errors --output $archive $url
          if ($LASTEXITCODE -ne 0) {
            throw "Downloading LLVM failed with exit code $LASTEXITCODE"
          }
        }
        $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash
        if (-not $actual.Equals($env:LLVM_SHA256, [StringComparison]::OrdinalIgnoreCase)) {
          throw "LLVM archive SHA-256 is $actual, want $env:LLVM_SHA256"
        }

        $extractRoot = Join-Path $env:RUNNER_TEMP "lib-llvm-extract"
        $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
        New-Item -ItemType Directory -Force $extractRoot | Out-Null
        & $sevenZip x -y "-o$extractRoot" $archive
        if ($LASTEXITCODE -ne 0) {
          throw "Decompressing the LLVM archive failed with exit code $LASTEXITCODE"
        }
        $tar = Get-ChildItem -LiteralPath $extractRoot -Filter "*.tar" | Select-Object -First 1
        & $sevenZip x -y "-o$extractRoot" $tar.FullName
        if ($LASTEXITCODE -ne 0) {
          throw "Extracting the LLVM archive failed with exit code $LASTEXITCODE"
        }
        $llvmRoot = Get-ChildItem -LiteralPath $extractRoot -Directory |
          Where-Object { Test-Path (Join-Path $_.FullName "bin\llvm-config.exe") } |
          Select-Object -First 1 -ExpandProperty FullName
        if (-not $llvmRoot) {
          throw "The LLVM development archive is incomplete"
        }
        Add-Content -Encoding utf8 $env:GITHUB_ENV "LLVM_ROOT=$llvmRoot"

    - name: Save LLVM 22 development archive
      if: steps.llvm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.tool_cache }}\lib-llvm\clang+llvm-22.1.8-x86_64-pc-windows-msvc.tar.xz
        key: lib-llvm-22.1.8-windows-msvc-d96c2cc1736f4eb7fa43cb9bbdf56d93551a9ae0a9aadb9c99c3c3b2b712a234-v1

    - name: Activate MSVC SDK
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile and run LLVM 22 demangle bridge
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $llvmConfig = Join-Path $env:LLVM_ROOT "bin\llvm-config.exe"
        $version = ((& $llvmConfig --version) -join "").Trim()
        if ($LASTEXITCODE -ne 0 -or -not $version.StartsWith("22.")) {
          throw "Expected LLVM 22, got '$version'"
        }
        $clang = Join-Path $env:LLVM_ROOT "bin\clang++.exe"
        $include = Join-Path $env:LLVM_ROOT "include"
        $demangle = Join-Path $env:LLVM_ROOT "lib\LLVMDemangle.lib"
        $test = Join-Path $env:RUNNER_TEMP "demangle_windows_test.exe"
        & $clang `
          --target=x86_64-pc-windows-msvc `
          -fuse-ld=lld `
          -fms-runtime-lib=static `
          -std=c++17 `
          "-I$include" `
          cpp/llvm/_wrap/demangle_windows.cpp `
          cpp/llvm/_wrap/demangle_windows_test.cpp `
          $demangle `
          -o $test
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path $test)) {
          throw "Compiling the LLVM demangle bridge failed with exit code $LASTEXITCODE"
        }
        & $test
        if ($LASTEXITCODE -ne 0) {
          throw "The LLVM demangle bridge smoke test failed with exit code $LASTEXITCODE"
        }
