  "Dir": ".sysroot/include",
  "Stdlib": ".sysroot/stdlib",
  "Files": [
    "llcppg.h"
  ],
  "Deps": [
    "..",
    "../..",
    "../../os",
    "../../signal",
    "../../time"
  ],
  "FailFast": 0,
  "Rename": {
    "pthread_mutex_t": "Mutex",
    "pthread_mutexattr_t": "MutexAttr",
    "pthread_cond_t": "Cond",
    "pthread_condattr_t": "CondAttr",
    "pthread_rwlock_t": "RWLock",
    "pthread_rwlockattr_t": "RWLockAttr",
    "pthread_once_t": "Once",
    "pthread_barrier_t": "Barrier",
    "pthread_barrierattr_t": "BarrierAttr",
    "pthread_spinlock_t": "Spinlock",
    "sem_t": "Sem",
    "_opaque_pthread_mutex_t": "Mutex",
    "_opaque_pthread_mutexattr_t": "MutexAttr",
    "_opaque_pthread_cond_t": "Cond",
    "_opaque_pthread_condattr_t": "CondAttr",
    "_opaque_pthread_rwlock_t": "RWLock",
    "_opaque_pthread_rwlockattr_t": "RWLockAttr",
    "_opaque_pthread_once_t": "Once",
    "_opaque_pthread_barrier_t": "Barrier",
    "_opaque_pthread_barrierattr_t": "BarrierAttr",
    "_opaque_pthread_spinlock_t": "Spinlock",
    "sem_trywait": "TryWait",
    "sem_timedwait": "TimedWait",
    "sem_getvalue": "GetValue"
