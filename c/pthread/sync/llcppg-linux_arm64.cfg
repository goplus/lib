  "MethodPrefix": {
    "Mutex": "mutex_",
    "MutexAttr": "mutexattr_",
    "Cond": "cond_",
    "CondAttr": "condattr_",
    "RWLock": "rwlock_",
    "RWLockAttr": "rwlockattr_",
    "Barrier": "barrier_",
    "BarrierAttr": "barrierattr_",
    "Spinlock": "spin_",
    "Once": "once_",
    "Sem": "sem_"
