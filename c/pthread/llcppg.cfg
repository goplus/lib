{
  "Name": "pthread",
  "Language": "c",
  "Dir": ".sysroot/include",
  "Stdlib": ".sysroot/stdlib",
  "Files": [
    "llcppg.h"
  ],
  "Deps": [
    "..",
    "../os",
    "../signal",
    "../time"
  ],
  "FailFast": 0,
  "Rename": {
    "pthread_attr_t": "Attr",
    "_opaque_pthread_attr_t": "Attr",
    "pthread_key_t": "Key",
    "pthread_t": "Thread",
    "pthread_jit_write_callback_t": "JitWriteCallbackT",
    "_llcppg_attr_t": "AttrT"
  },
  "TypePrefix": [
    "pthread_"
  ],
  "TypeSuffix": [
    "_t"
  ],
  "FuncPrefix": [
    "pthread_"
  ],
  "Class": [
    "pthread_key_t"
  ],
  "FuncIgnore": [
    "pthread_attr_destroy",
    "pthread_attr_getdetachstate",
    "pthread_attr_getstackaddr",
    "pthread_attr_getstacksize",
    "pthread_attr_init",
    "pthread_attr_setdetachstate",
    "pthread_attr_setstackaddr",
    "pthread_attr_setstacksize",
    "pthread_cancel",
    "pthread_create",
    "pthread_exit",
    "pthread_getspecific",
    "pthread_join",
    "pthread_key_create",
    "pthread_key_delete",
    "pthread_setspecific"
  ]
}
